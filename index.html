<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atharv Teg Rattan | Home</title>

  <!-- Pico for layout -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@latest/css/pico.min.css">

  <style>
    /* ====== THEME ====== */
    :root {
      --lightblue: #cfe3ff;
      --white: #ffffff;
    }

    /* ====== BACKGROUND IMAGE ====== */
    body {
      margin: 0;
      min-height: 100vh;
      background: url("assets/images/Baryonyx.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--lightblue);
      position: relative;
      overflow-x: hidden;
    }

    /* dark overlay to improve text readability */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 26, 47, 0.7); /* navy-blue transparent overlay */
      z-index: 0;
    }

    /* NAVBAR */
    nav.container-fluid {
      color: var(--lightblue);
      z-index: 2;
      position: relative;
    }
    nav.container-fluid a {
      color: var(--lightblue) !important;
      transition: color 0.2s ease;
    }
    nav.container-fluid a:hover {
      color: var(--white) !important;
    }

    /* ====== HERO SECTION ====== */
    header.hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5rem 1rem;
      position: relative;
      z-index: 1;
    }

    header.hero h1 {
      color: var(--white);
      font-size: clamp(2.8rem, 6vw, 5rem);
      margin-bottom: 1rem;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
    }

    header.hero p {
      color: var(--lightblue);
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* ====== BUTTON ====== */
    .cta-btn {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      font-size: 1.1rem;
      color: var(--white);
      background: transparent;
      border: 2px solid var(--white);
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .cta-btn:hover {
      transform: scale(1.08);
      background: var(--white);
      color: #0a1a2f;
    }

    /* ====== PROFILE PICTURE ====== */
    .profile-pic {
      margin-top: 2rem;
      width: 200px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }
    .profile-pic:hover {
      transform: scale(1.03);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 1rem 0;
      color: var(--lightblue);
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <!-- ====== NAVBAR ====== -->
  <nav class="container-fluid">
    <ul><li><strong style="color:var(--white)">Atharv</strong></li></ul>
    <ul>
      <li><a href="index.html" aria-current="page">🏠Home</a></li>
      <li><a href="about.html">🔎About</a></li>
      <li><a href="projects.html">🤖Projects</a></li>
      <li><a href="art.html">🎨Art</a></li>
      <li><a href="contact.html">📞Contact</a></li>
    </ul>
  </nav>

  <!-- ====== HERO ====== -->
  <header class="hero">
    <h1>Atharv Teg Rattan</h1>
    <p>Working towards making a business, making friends, family, and many memories &lt;3.</p>

    <a href="about.html" class="cta-btn">Get to know more about me! 😁</a>

    <img src="assets/images/headshot/me.JPG" alt="Portrait of Atharv Teg Rattan" class="profile-pic">
  </header>

  <!-- ====== FOOTER ====== -->
  <footer>
    © 2025 Atharv Teg Rattan
  </footer>
</body>
</html>
